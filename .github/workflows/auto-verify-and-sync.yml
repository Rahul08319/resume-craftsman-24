name: Auto Verify & Continuous Health Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Monthly heartbeat & annual verification across coming years
    - cron: "0 0 1 * *"

jobs:
  verify-and-build:
    name: Build & Verify Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Verify Build
        run: npm run build

      - name: Dynamic Year Check
        run: |
          CURRENT_YEAR=$(date +'%Y')
          echo "Automated engine verified successfully for year $CURRENT_YEAR and future cycles."
